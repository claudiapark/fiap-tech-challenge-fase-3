[project]
name = "medical-triage"
version = "0.1.0"
description = "Academic medical text triage API with CI/CD, Airflow and observability"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "numpy>=2.0,<3",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "prometheus-client>=0.21,<1",
    "pydantic-settings>=2.7,<3",
    "scikit-learn>=1.6,<2",
    "skl2onnx>=1.18,<2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_triage"]

[tool.pytest.ini_options]
addopts = "-q --cov=medical_triage --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
